{% extends "base.html" %}

{% block content %}
<div class="dashboard">
    <section class="dashboard-card">
        <h2 class="section-title"><span class="title-icon map-pin-icon" aria-hidden="true"></span>避難所マップ</h2>
        <div id="shelterMap"></div>
    </section>

    <section class="dashboard-card weather-card">
        <div class="section-heading">
            <h2 class="section-title"><span class="title-icon weather-title-icon">☁</span>青森市 気象警報・注意報</h2>
            <p class="auto-refresh">↻ 10分おき自動更新</p>
        </div>
        <div id="weatherContent">
            <p class="loading-message">読み込み中...</p>
        </div>
    </section>
</div>

<style>
    .dashboard {
        display: grid;
        gap: 34px;
    }

    .dashboard-card {
        padding: 28px;
        border-radius: 16px;
        background: var(--app-surface);
        box-shadow: 0 5px 22px rgba(42, 69, 108, 0.08);
    }

    .section-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 22px;
    }

    .section-title {
        display: flex;
        align-items: center;
        gap: 9px;
        margin: 0 0 22px;
        color: var(--app-blue);
        font-size: 23px;
        font-weight: 700;
    }

    .section-heading .section-title {
        margin-bottom: 0;
    }

    .title-icon {
        font-size: 20px;
        line-height: 1;
    }

    .map-pin-icon {
        position: relative;
        display: inline-block;
        width: 18px;
        height: 22px;
    }

    .map-pin-icon::before {
        position: absolute;
        top: 1px;
        left: 1px;
        width: 16px;
        height: 16px;
        border-radius: 50% 50% 50% 0;
        background: var(--app-blue);
        content: "";
        transform: rotate(-45deg);
    }

    .map-pin-icon::after {
        position: absolute;
        top: 6px;
        left: 6px;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #fff;
        content: "";
    }

    .weather-title-icon {
        color: var(--app-blue);
    }

    #shelterMap {
        height: 365px;
        overflow: hidden;
        border-radius: 11px;
    }

    .auto-refresh {
        margin: 0;
        color: var(--app-green);
        font-weight: 700;
        white-space: nowrap;
    }

    #weatherContent {
        min-height: 145px;
        padding: 22px 20px;
        border-radius: 11px;
        background: #f7f8fa;
        color: var(--app-muted);
    }

    #weatherContent p {
        margin: 0 0 12px;
    }

    #weatherContent p:last-child {
        margin-bottom: 0;
    }

    #weatherContent .weather-location::before {
        content: "●";
        margin-right: 8px;
        color: #596575;
    }

    #weatherContent .weather-status {
        color: var(--app-green);
        font-weight: 700;
    }

    #weatherContent .weather-status::before {
        content: "✓";
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 18px;
        height: 18px;
        margin-right: 8px;
        border-radius: 50%;
        color: #fff;
        background: var(--app-green);
        font-size: 12px;
    }

    .loading-message {
        color: var(--app-muted);
    }

    @media (max-width: 600px) {
        .dashboard-card {
            padding: 20px 16px;
            border-radius: 12px;
        }

        .section-heading {
            display: block;
        }

        .section-title {
            font-size: 19px;
        }

        .auto-refresh {
            margin-top: 12px;
        }

        #shelterMap {
            height: 280px;
        }
    }
</style>

<!-- Leaflet の読み込み -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // 地図の初期化（藤沢市周辺を中心に設定）
    const map = L.map('shelterMap').setView([35.3390, 139.4903], 12);

    // OpenStreetMapタイルを追加
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors',
        referrerPolicy: 'strict-origin-when-cross-origin'
    }).addTo(map);

    // 気象警報・注意報の自動更新機能
    function updateWeatherWarnings() {
        fetch('/api/weather_warnings')
            .then(response => response.json())
            .then(data => {
                console.log('気象情報を更新しました:', data);
                updateWeatherContent(data);
            })
            .catch(error => {
                console.error('気象情報の更新に失敗しました:', error);
            });
    }

    function updateWeatherContent(data) {
        const weatherContent = document.getElementById('weatherContent');

        if (data.error) {
            weatherContent.innerHTML = '<p>気象情報の取得に失敗しました</p>';
            return;
        }

        let warningsHtml = '';
        if (data.warnings && data.warnings.length > 0) {
            warningsHtml = '<ul class="weather-warning-list">';
            data.warnings.forEach(warning => {
                warningsHtml += `<li>${warning.name}（${warning.status}）</li>`;
            });
            warningsHtml += '</ul>';
        } else {
            warningsHtml = '<p class="weather-status">現在、警報・注意報は発表されていません</p>';
        }

        weatherContent.innerHTML = `
            <p class="weather-location">${data.area_name || '青森市'}</p>
            ${warningsHtml}
            <p>◷ データ取得: <span id="lastFetchTime">${data.last_fetch_time || '更新中...'}</span></p>
            <p>◔ 気象庁発表: ${data.report_time || '不明'}</p>
        `;
    }

    // 初回表示＋10分（600,000ミリ秒）おきに自動更新
    updateWeatherWarnings();
    setInterval(updateWeatherWarnings, 600000);
});
</script>
{% endblock %}
