{% extends "base.html" %}

{% block content %}
<h2>避難所検索</h2>
<p>条件を指定して登録されている避難所を検索できます。</p>

<form class="shelter-search-form" method="get" action="{{ url_for('search_results') }}">
  <div class="search-field">
    <label for="keyword">避難所名で検索</label>
    <input type="search" id="keyword" name="keyword" placeholder="キーワード">
  </div>

  <div class="search-field">
    <label for="district">地区から探す</label>
    <select id="district" name="district">
      <option value="">すべての地区</option>
      {% for district in districts %}
      <option value="{{ district }}">{{ district }}</option>
      {% endfor %}
    </select>
  </div>

  <fieldset>
    <legend>対応する災害種別</legend>
    {% for hazard in ('津波', '土砂崩れ', '洪水') %}
    <label><input type="checkbox" name="hazard" value="{{ hazard }}"> {{ hazard }}</label>
    {% endfor %}
  </fieldset>

  <fieldset>
    <legend>ペット受け入れ</legend>
    <label><input type="checkbox" name="pet" value="allowed"> ペット可</label>
    <label><input type="checkbox" name="pet" value="not_allowed"> ペット不可</label>
  </fieldset>

  <label class="search-checkbox">
    <input type="checkbox" name="barrier_free" value="true">
    バリアフリー対応
  </label>

  <button type="submit">検索</button>
</form>

<p><a href="{{ url_for('all_shelters') }}">全施設一覧を表示</a></p>

<style>
  .shelter-search-form {
    display: grid;
    gap: 22px;
    max-width: 680px;
    padding: 24px;
    border-radius: 12px;
    background: var(--app-surface);
    box-shadow: 0 4px 16px rgba(42, 69, 108, 0.08);
  }

  .search-field {
    display: grid;
    gap: 8px;
  }

  .search-field label,
  fieldset legend {
    color: var(--app-text);
    font-weight: 700;
  }

  .search-field input[type="search"] {
    min-height: 42px;
    padding: 8px 12px;
    border: 1px solid #c7d0dc;
    border-radius: 6px;
    font: inherit;
  }

  .search-field select {
    min-height: 42px;
    padding: 8px 12px;
    border: 1px solid #c7d0dc;
    border-radius: 6px;
    background: #fff;
    font: inherit;
  }

  fieldset {
    display: flex;
    flex-wrap: wrap;
    gap: 12px 20px;
    padding: 0;
    border: 0;
  }

  fieldset legend {
    width: 100%;
    margin-bottom: 2px;
  }

  label {
    cursor: pointer;
  }

  input[type="checkbox"] {
    width: 18px;
    height: 18px;
    margin: 0 5px 0 0;
    vertical-align: -4px;
  }

  .search-checkbox {
    width: fit-content;
  }

  .shelter-search-form button {
    width: fit-content;
    min-height: 42px;
    padding: 8px 24px;
    border: 0;
    border-radius: 6px;
    background: var(--app-blue);
    color: #fff;
    cursor: pointer;
    font: inherit;
    font-weight: 700;
  }

  .shelter-search-form button:hover {
    background: var(--app-blue-dark);
  }

  @media (max-width: 600px) {
    .shelter-search-form {
      padding: 18px;
    }
  }
</style>
{% endblock %}
